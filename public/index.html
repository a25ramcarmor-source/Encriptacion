<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Firma digital RSA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


   
<div class="pantalla-nom">
    <div class="targeta-nom">
        <h1>Benvingut</h1>
        <p>Introdueix el teu nom per començar</p>

        <input id="nom" placeholder="Escriu el teu nom..." maxlength="20">

        <button id="guardarnom">
            Entrar
        </button>
    </div>
</div>


<div class="container">

    <h1>Signatura digital RSA</h1>


    <div class="contingu">

        <div class="misclaves">

            <h2>Les meves claus</h2>

            <label for="clauPublica">Clau pública pròpia:</label>
            <textarea id="clauPublica" rows="6" cols="60" readonly></textarea>

            <label for="clauPrivada">Clau privada pròpia:</label>
            <textarea id="clauPrivada" rows="6" cols="60" readonly></textarea>

            <button id="generar">Generar claus</button>

        </div>


        <div class="remota">

            <h2>Clau pública remota</h2>

            <textarea id="clauRemota" rows="6" cols="60"
                placeholder="Enganxa aquí la clau pública de l'altre navegador" readonly></textarea>

            <h2>Missatge</h2>

            <textarea id="sms" rows="6" cols="60" placeholder="Escriu el teu missatge aquí"></textarea><br>

            <button id="firmar">Signar missatge</button>
            <button id="Cont_cifrar">Xifrar missatge</button>

        </div>

        <div id="llistaUsuaris">

        </div>

    </div>



    <div class="contingu">

        <div class="cifrado">

            <h2>Missatge signat (JSON)</h2>

            <textarea id="msn_json" rows="6" cols="60" placeholder="Aquí apareixerà el JSON signat"></textarea>

            <button id="cifrar">Xifrar missatge</button>

            <h2>Missatge xifrat</h2>

            <textarea id="msn_cifrat" rows="6" cols="60" placeholder="Aquí apareixerà el missatge xifrat" readonly></textarea>

            <button id="enviar">Enviar</button>

        </div>



        <div class="descifrado">

            <h2>Missatge rebut</h2>

            <textarea id="msn_rebut" rows="6" cols="60"
                placeholder="Enganxa aquí el missatge xifrat rebut"></textarea>

            <button id="descifrar">Desxifrar missatge</button>

            <h2>Missatge desxifrat (JSON)</h2>

            <textarea id="smsDescifrado" rows="6" cols="60"
                placeholder="Aquí apareixerà el JSON desxifrat"></textarea>

            <button id="verificar">Verificar signatura</button>

        </div>

        <div id="msn_rebuts">
            <h3>Missatges rebuts</h3>
        </div>

    </div>



    <p id="resultado"></p>

</div>

    <script src="http://crypto-js.googlecode.com/svn/tags/3.0.2/build/rollups/aes.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <script src="funcions.js"></script>

</body>

</html>
